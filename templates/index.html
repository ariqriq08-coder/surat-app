<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="flowers"></div>
    
    <div class="container">
        <div class="envelope" id="envelope" onclick="openLetter()">
            <div class="flap"></div>
            <div class="letter">
                <p id="text"></p>
            </div>
        </div>
    </div>
    <audio id="bgMusic" loop>
    <source src="{{ url_for('static', filename='musicmp3.mp3') }}" type="audio/mpeg">
</audio>
    <script>
        // Pesan teks tanpa animasi hati
     const message = "Assalamualaikum, hai Mazu…hehe.Apa kabar? Semoga selalu sehat ya. Selamat atas seminar hasil kemarin, semoga semua yang mazu usahakan membawa hasil yang terbaik. Ariq sebenarnya sempat bingung mau kasih apa. Mau nitip lewat Syifa juga rasanya nggak enak, soalnya sudah sering. Jadi untuk sekarang, Ariq cuma bisa mendoakan yang terbaik untuk mazu. Semoga ke depan semuanya dilancarkan, apalagi nanti masih ada ujian lagi—tetap semangat ya. Maaf juga kalau Ariq sering banyak tanya soal kuliah mazu. Jujur, Ariq memang belum terlalu paham dunia kuliah mazu gimana, jadi kadang suka penasaran. Belakangan ini juga komunikasi kita jadi agak berkurang ya. Sebenarnya nggak masalah sih, Ariq sadar juga bukan siapa-siapa. Tapi tetap, kalau ada kata atau sikap Ariq yang mengganggu, mohon maaf ya. Lucu juga ya, kita sampai sekarang belum pernah ketemu langsung. Tapi mungkin memang belum waktunya aja. Kalau memang sudah jalannya, nanti pasti ketemu kok. Intinya, tetap semangat ya Mazu. Memang capek, namanya juga dunia. kayak kata Aldi Taher, “dunia memang tempatnya capek, nanti sudah nggak capek kalau sudah di surga.” Kurang lebih kyk gitu lah hehe. Just do your best, keep your spirit up yaa 😊.";
        
        let i = 0;
        let isOpened = false;

        function typeWriter() {
            if (i < message.length) {
                document.getElementById("text").innerHTML += message.charAt(i);
                i++;
                setTimeout(typeWriter, 50); 
            }
        }

        function openLetter() {
    if (isOpened) return;
    isOpened = true;

    // Membuka amplop
    const envelope = document.getElementById("envelope");
    envelope.classList.add("open");

    // ▶️ TAMBAHKAN INI (musik)
    const music = document.getElementById("bgMusic");
    music.volume = 0.5;
    music.play();

    // Mulai ngetik
    setTimeout(typeWriter, 800);
}
    </script>

</body>
</html>
